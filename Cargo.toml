[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dashmap = "5.4"
env_logger = "0.10"
log = "0.4.22"
pixels = "0.13.0"
rand = "0.8.5"
rayon = "1.7"
winit = "0.28"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "memoization_benchmark"
harness = false

# Build profiles
[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
